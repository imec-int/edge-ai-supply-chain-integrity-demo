[project]
name = "supply-chain-integrity-demo"
version = "0.1.0"
description = "Sign, attest, and verify a layered software supply chain (Kairos OS image + AI model) with Cosign, Syft, and CycloneDX"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cyclonedx-python-lib>=11.11.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "huggingface-hub>=0.36.0",
]

[project.optional-dependencies]
# Needed only for ai_model/demo.py's ONNX compile steps (optimum-onnx, onnxruntime.quantization).
onnx-export = ["optimum-onnx>=0.1.0", "onnxruntime>=1.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_model", "os_image"]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.15.0"]
