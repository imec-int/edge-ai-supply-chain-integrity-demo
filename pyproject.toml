[project]
name = "supply-chain-integrity-demo"
version = "0.1.0"
description = "Sign, attest, and verify a layered software supply chain (Kairos OS image + AI model) with Cosign, Syft, and CycloneDX"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    # Only used to *build* the AI-BOM document (CycloneDX object model + serializer).
    # There is no off-the-shelf CLI that captures compiler/quantization provenance for
    # a compiled model, so this is the one layer that needs custom code.
    "cyclonedx-python-lib>=11.11.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    # Just used to fetch/hash the source model file from the Hub - not for training/inference.
    "huggingface-hub>=0.36.0",
]

[project.optional-dependencies]
# Needed only for the real "compile" steps in ai_model/demo.py: HF checkpoint -> ONNX
# (optimum-onnx) and ONNX -> quantized ONNX (onnxruntime.quantization, ships with
# onnxruntime). Kept optional so the os_image demo doesn't need torch at all.
onnx-export = ["optimum-onnx>=0.1.0", "onnxruntime>=1.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_model"]

[tool.uv]
package = true

[dependency-groups]
dev = ["ruff>=0.15.0"]



